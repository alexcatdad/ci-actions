name: Rootless image build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted label or an isolated rootless-build-capable ARC label
        type: string
        default: ubuntu-latest
      context:
        description: Repository-relative build context
        type: string
        default: .
      dockerfile:
        description: Repository-relative Dockerfile
        type: string
        default: Dockerfile
      image:
        description: Fully qualified lower-case image name, without tag
        type: string
        required: true
      publish:
        description: Push a commit tag; allowed only for a push to the caller default branch
        type: boolean
        default: false
      platforms:
        description: One native architecture or the supported AMD64/ARM64 pair
        type: string
        default: linux/amd64
      cache:
        description: Enable repository and ref scoped GitHub Actions v2 layer cache
        type: boolean
        default: true
      cache-import:
        description: Import previous layers; false measures a cold build while still exporting
        type: boolean
        default: true
    secrets:
      registry-username:
        required: false
      registry-password:
        required: false
    outputs:
      cached-steps:
        description: Number of BuildKit steps reported CACHED
        value: ${{ jobs.build.outputs.cached-steps }}
      build-seconds:
        description: Wall seconds including cache import and export
        value: ${{ jobs.build.outputs.build-seconds }}
      digest:
        description: Immutable image digest
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: Image name at its immutable digest (not available in a registry unless published)
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    container:
      image: moby/buildkit:v0.33.1-rootless@sha256:980970b9ed3682d1933cc5bd1b2ebbc00686693e03f571ec3a8f59c376fe2d78
      # Hosted Docker requires these rootless user-namespace allowances. ARC must
      # supply an equivalent scoped pod policy; it does not use these options.
      options: --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    defaults:
      run:
        # Hosted file commands belong to the host runner UID. A root shim fixes
        # only those files before dropping to the rootless image user. ARC is
        # already UID 1000 and goes directly to the nonroot shell.
        shell: sh /tmp/ci-nonroot-shell {0}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.build.outputs.image }}
      cached-steps: ${{ steps.build.outputs.cached-steps }}
      build-seconds: ${{ steps.build.outputs.build-seconds }}
    steps:
      - name: Reject untrusted homelab pull requests before checkout
        if: inputs.runner == 'homelab' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: sh
        run: exit 1
      - name: Prepare nonroot step shell
        shell: sh
        run: |
          set -eu
          cat > /tmp/ci-nonroot-shell <<'SHELL'
          #!/bin/sh
          set -eu
          if [ "$(id -u)" = 0 ]; then
            for path in "$GITHUB_OUTPUT" "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_STEP_SUMMARY"; do
              [ -z "$path" ] || chown 1000:1000 "$path"
            done
            export CI_STEP_SCRIPT="$1"
            # shellcheck disable=SC2016
            exec su -p user -s /bin/sh -c 'exec sh "$CI_STEP_SCRIPT"'
          fi
          exec sh "$1"
          SHELL
          chmod 755 /tmp/ci-nonroot-shell
      - name: Expose GitHub Actions cache runtime
        id: cache-runtime
        if: inputs.cache
        continue-on-error: true
        uses: alexcatdad/ci-actions/.github/actions/buildkit-cache-runtime@3ceab9b1034e106316d1c40f142bb13c97370004
      - name: Checkout caller without persisted credentials
        id: checkout
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          export HOME=/home/user
          checkout=$(mktemp -d /tmp/ci-checkout.XXXXXX)
          trap 'rm -rf "$checkout"' EXIT HUP INT TERM
          cd "$checkout"
          git init -q
          git remote add origin "https://github.com/$CHECKOUT_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CHECKOUT_TOKEN auth
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
          printf 'directory=%s\n' "$checkout" >> "$GITHUB_OUTPUT"
          trap - EXIT HUP INT TERM
      - name: Build and optionally publish
        id: build
        env:
          CHECKOUT_DIRECTORY: ${{ steps.checkout.outputs.directory }}
          BUILD_CONTEXT: ${{ inputs.context }}
          BUILD_DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_IMAGE: ${{ inputs.image }}
          BUILD_PUBLISH: ${{ inputs.publish }}
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          BUILD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_CACHE: ${{ inputs.cache }}
          BUILD_CACHE_IMPORT: ${{ inputs.cache-import }}
          CACHE_RUNTIME_MODE: ${{ steps.cache-runtime.outputs.mode }}
          BUILD_PLATFORMS: ${{ inputs.platforms }}
          REGISTRY_USERNAME: ${{ inputs.publish && secrets.registry-username || '' }}
          REGISTRY_PASSWORD: ${{ inputs.publish && secrets.registry-password || '' }}
        run: |
          set -eu
          export HOME=/home/user
          fail() { printf '%s\n' "$1" >&2; exit 1; }
          case "$BUILD_PLATFORMS" in
            linux/amd64|linux/amd64,linux/arm64) ;;
            *) fail 'Unsupported build platforms' ;;
          esac
          # Only local paths beneath the checkout. Reject symlink escapes too.
          case "$BUILD_CONTEXT:$BUILD_DOCKERFILE" in *[!a-zA-Z0-9_./:-]*) fail 'Unsupported build path' ;; esac
          case "$BUILD_CONTEXT" in /*) fail 'Context must be relative' ;; esac
          case "$BUILD_DOCKERFILE" in /*) fail 'Dockerfile must be relative' ;; esac
          workspace=$(realpath "$CHECKOUT_DIRECTORY")
          context=$(realpath "$CHECKOUT_DIRECTORY/$BUILD_CONTEXT")
          dockerfile=$(realpath "$CHECKOUT_DIRECTORY/$BUILD_DOCKERFILE")
          case "$context/" in "$workspace/"*) ;; *) fail 'Context escapes checkout' ;; esac
          case "$dockerfile" in "$workspace/"*) ;; *) fail 'Dockerfile escapes checkout' ;; esac
          if ! test -d "$context" || ! test -f "$dockerfile"; then fail 'Build paths do not exist'; fi
          printf '%s\n' "$BUILD_IMAGE" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:[0-9]+)?/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$' || fail 'Invalid registry/image name'
          work=$(mktemp -d)
          export DOCKER_CONFIG="$work/auth"
          mkdir -p "$DOCKER_CONFIG"
          cleanup() {
            status=$?
            trap - EXIT
            # BuildKit snapshots can contain read-only package caches or mapped
            # UIDs. The disposable container owns their physical removal.
            if ! rm -rf "$DOCKER_CONFIG" "$work/image.tar" "$work/metadata.json" "$work/build.log" "$work/runc"; then
              printf '%s\n' 'Failed to remove credentials or build outputs' >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if [ "$BUILD_PUBLISH" = true ]; then
            if ! test "$BUILD_EVENT" = push || ! test "$BUILD_REF" = "refs/heads/$BUILD_DEFAULT_BRANCH"; then fail 'Publishing requires a push to the default branch'; fi
            if ! test -n "$REGISTRY_USERNAME" || ! test -n "$REGISTRY_PASSWORD"; then fail 'Publishing requires explicit registry credentials'; fi
            registry=${BUILD_IMAGE%%/*}
            auth=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
            printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$registry" "$auth" > "$DOCKER_CONFIG/config.json"
            chmod 600 "$DOCKER_CONFIG/config.json"
            output="type=image,name=$BUILD_IMAGE:sha-$BUILD_SHA,push=true"
          else
            output="type=oci,dest=$work/image.tar"
          fi
          unset REGISTRY_USERNAME REGISTRY_PASSWORD auth
          # Work around hosts denying keyctl; the job mounts no host socket.
          cat > "$work/runc" <<'RUNC'
          #!/bin/sh
          count=$#
          while [ "$count" -gt 0 ]; do
            arg=$1; shift
            set -- "$@" "$arg"
            if [ "$arg" = run ]; then set -- "$@" --no-new-keyring; fi
            count=$((count - 1))
          done
          exec /usr/bin/buildkit-runc "$@"
          RUNC
          chmod 700 "$work/runc"
          export BUILDKITD_FLAGS="--oci-worker-no-process-sandbox --oci-worker-snapshotter=native --oci-worker-binary=$work/runc --root $work/state"
          # Stable within an image configuration, isolated by GitHub repository/ref access.
          scope=$(printf '%s\n' "$BUILD_IMAGE" "$BUILD_PLATFORMS" "$BUILD_CONTEXT" "$BUILD_DOCKERFILE" | sha256sum | cut -d ' ' -f 1)
          set --
          if [ "$BUILD_CACHE" = true ] && [ "$CACHE_RUNTIME_MODE" = gha-v2 ]; then
            if [ "$BUILD_CACHE_IMPORT" = true ]; then
              set -- "$@" --import-cache "type=gha,version=2,scope=$scope,timeout=2m"
            fi
            set -- "$@" --export-cache "type=gha,version=2,scope=$scope,mode=max,timeout=2m,ignore-error=true"
          fi
          started=$(date +%s)
          source_epoch=$(git -C "$CHECKOUT_DIRECTORY" show -s --format=%ct "$BUILD_SHA")
          cpu_before=$(cat /sys/fs/cgroup/cpu.stat 2>/dev/null || true)
          run_build() {
            buildctl-daemonless.sh build --progress plain --frontend dockerfile.v0 \
            --local "context=$context" --local "dockerfile=$(dirname "$dockerfile")" \
            --opt "filename=$(basename "$dockerfile")" --opt "platform=$BUILD_PLATFORMS" \
            --opt "build-arg:SOURCE_DATE_EPOCH=$source_epoch" \
            --opt "label:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --opt "label:org.opencontainers.image.revision=$BUILD_SHA" \
            --output "$output" --metadata-file "$work/metadata.json" "$@"
          }
          cache_import_unavailable() {
            # Inspect only the terminal solve error, never intermediate warnings.
            # A compiler error elsewhere in the log cannot trigger this retry.
            tail -n 1 "$1" | grep -Ei '^ERROR:.*(import.*cache|cache.*import).*(timeout|timed out|401|403|429|5[0-9][0-9]|connection refused|connection reset|no such host|unexpected status|failed to fetch)' >/dev/null
          }
          if run_build "$@" > "$work/build.log" 2>&1; then
            build_status=0
          else
            build_status=$?
          fi
          if [ "$build_status" -ne 0 ] && [ "$BUILD_CACHE_IMPORT" = true ] && [ "$CACHE_RUNTIME_MODE" = gha-v2 ] && cache_import_unavailable "$work/build.log"; then
            cat "$work/build.log"
            printf '%s\n' 'Cache import unavailable; retrying once without remote cache.'
            CACHE_RUNTIME_MODE=off
            if run_build > "$work/build.log" 2>&1; then build_status=0; else build_status=$?; fi
          fi
          cat "$work/build.log"
          elapsed=$(( $(date +%s) - started ))
          cached=$(grep -c '^#[0-9][0-9]* CACHED$' "$work/build.log" || true)
          printf 'cached-steps=%s\nbuild-seconds=%s\n' "$cached" "$elapsed" >> "$GITHUB_OUTPUT"
          {
            printf '### Build cache measurement\n\n- Cache enabled: %s; import: %s; runtime: %s\n- Cached steps: %s\n- Build seconds: %s\n' "$BUILD_CACHE" "$BUILD_CACHE_IMPORT" "$CACHE_RUNTIME_MODE" "$cached" "$elapsed"
            # shellcheck disable=SC2016
            printf '\nCPU before:\n```\n%s\n```\nCPU after:\n```\n' "$cpu_before"
            cat /sys/fs/cgroup/cpu.stat 2>/dev/null || true
            printf '```\nMemory peak (bytes): '
            cat /sys/fs/cgroup/memory.peak 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$build_status" -eq 0 ] || exit "$build_status"
          digest=$(sed -n 's/^[[:space:]]*"containerimage.digest": "\(sha256:[a-f0-9]*\)".*/\1/p' "$work/metadata.json")
          printf '%s\n' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$' || fail 'Missing image digest'
          if [ "$BUILD_PUBLISH" != true ]; then
            tar -tf "$work/image.tar" | grep -qx index.json || fail 'Missing OCI index'
          fi
          printf 'digest=%s\nimage=%s@%s\n' "$digest" "$BUILD_IMAGE" "$digest" >> "$GITHUB_OUTPUT"
      - name: Remove disposable checkout
        if: always()
        env:
          CHECKOUT_DIRECTORY: ${{ steps.checkout.outputs.directory }}
        run: |
          case "$CHECKOUT_DIRECTORY" in
            /tmp/ci-checkout.*) rm -rf "$CHECKOUT_DIRECTORY" ;;
          esac
