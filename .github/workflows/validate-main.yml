name: Validate main
# Validation-only contract for the default branch after merge: full-history
# leak scan, full tests, integration and security checks. It never publishes,
# tags, signs, deploys or dispatches. Callers may invoke it from a push to the
# default branch or from a schedule (for example a weekly security run); it does
# not depend on the calling event.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; default is GitHub-hosted ubuntu-latest.
        type: string
        default: ubuntu-latest
      go-version:
        description: Go toolchain for the leak scanner and optionally the app; empty uses the runner default.
        type: string
        default: '1.27.3'
      bun-version:
        description: Bun version to install before app commands; empty skips installation.
        type: string
        default: ''
      node-version:
        description: Node.js version to install (with corepack enabled for pnpm or npm) before app commands; empty skips installation.
        type: string
        default: ''
      nix:
        description: Install Nix 2.35.4 (flakes enabled) before app commands; false skips installation.
        type: boolean
        default: false
      test-command:
        description: Repository-owned full test command; empty skips.
        type: string
        default: ''
      integration-command:
        description: Repository-owned integration check command; empty skips.
        type: string
        default: ''
      security-command:
        description: Repository-owned heavier security validation command (for example vulnerability scanning); empty skips.
        type: string
        default: ''
      leak-scan:
        description: Scan full Git history for secrets.
        type: boolean
        default: true
    secrets:
      app-client-id:
        description: Optional GitHub App client ID. With app-private-key and nix, mints a contents-read installation token that Nix uses to fetch private flake inputs of the repository owner.
        required: false
      app-private-key:
        description: Optional GitHub App private key paired with app-client-id.
        required: false
permissions:
  contents: read
jobs:
  leaks:
    if: inputs.leak-scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Scan history for leaked secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --no-banner --redact
  test:
    if: inputs.test-command != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Gates the optional Nix token step; a client ID is not a credential.
      NIX_APP_CLIENT_ID: ${{ inputs.nix && secrets.app-client-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.node-version != ''
        name: Enable corepack
        # Node 25+ no longer bundles corepack; install a pinned copy when absent.
        run: command -v corepack >/dev/null || npm install --global corepack@0.36.0; corepack enable
      - if: env.NIX_APP_CLIENT_ID != ''
        id: nix-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.NIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - if: inputs.nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
          github_access_token: ${{ steps.nix-token.outputs.token }}
      - name: Test
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
  integration:
    if: inputs.integration-command != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Gates the optional Nix token step; a client ID is not a credential.
      NIX_APP_CLIENT_ID: ${{ inputs.nix && secrets.app-client-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.node-version != ''
        name: Enable corepack
        # Node 25+ no longer bundles corepack; install a pinned copy when absent.
        run: command -v corepack >/dev/null || npm install --global corepack@0.36.0; corepack enable
      - if: env.NIX_APP_CLIENT_ID != ''
        id: nix-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.NIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - if: inputs.nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
          github_access_token: ${{ steps.nix-token.outputs.token }}
      - name: Integration checks
        env:
          COMMAND: ${{ inputs.integration-command }}
        run: bash -euo pipefail -c "$COMMAND"
  security:
    if: inputs.security-command != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Gates the optional Nix token step; a client ID is not a credential.
      NIX_APP_CLIENT_ID: ${{ inputs.nix && secrets.app-client-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.node-version != ''
        name: Enable corepack
        # Node 25+ no longer bundles corepack; install a pinned copy when absent.
        run: command -v corepack >/dev/null || npm install --global corepack@0.36.0; corepack enable
      - if: env.NIX_APP_CLIENT_ID != ''
        id: nix-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.NIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - if: inputs.nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
          github_access_token: ${{ steps.nix-token.outputs.token }}
      - name: Security validation
        env:
          COMMAND: ${{ inputs.security-command }}
        run: bash -euo pipefail -c "$COMMAND"
