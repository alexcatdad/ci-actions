name: Validate pull request
# Validation-only contract: leak scan, dependency review, lint, build and tests. It
# reads source and reports a result. It never publishes, tags, signs, deploys or dispatches.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; default is GitHub-hosted ubuntu-latest.
        type: string
        default: ubuntu-latest
      go-version:
        description: Go toolchain for the leak scanner and optionally the app; empty uses the runner default.
        type: string
        default: '1.27.3'
      bun-version:
        description: Bun version to install before app commands; empty skips installation.
        type: string
        default: ''
      node-version:
        description: Node.js version to install (with corepack enabled for pnpm or npm) before app commands; empty skips installation.
        type: string
        default: ''
      nix:
        description: Install Nix 2.35.4 (flakes enabled) before app commands; false skips installation.
        type: boolean
        default: false
      lint-command:
        description: Repository-owned lint command run from the repository root; empty skips.
        type: string
        default: ''
      build-command:
        description: Repository-owned compile/build validation command; empty skips.
        type: string
        default: ''
      test-command:
        description: Repository-owned test command run from the repository root; empty skips.
        type: string
        default: ''
      leak-scan:
        description: Scan the checked-out tree for secrets.
        type: boolean
        default: true
      dependency-review:
        description: Fail the pull request on newly introduced dependencies with high or critical advisories or disallowed licenses.
        type: boolean
        default: true
      inert-paths:
        description: Newline-separated glob pathspecs (for example README.md or docs/**) that cannot affect lint, build or tests. A pull request that changes only these paths skips lint, build and test; leaks and deps always run. Empty runs everything.
        type: string
        default: ''
    secrets:
      app-client-id:
        description: Optional GitHub App client ID. With app-private-key and nix, mints a contents-read installation token that Nix uses to fetch private flake inputs of the repository owner.
        required: false
      app-private-key:
        description: Optional GitHub App private key paired with app-client-id.
        required: false
permissions:
  contents: read
jobs:
  leaks:
    if: inputs.leak-scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Scan tree for leaked secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --no-banner --redact
  deps:
    # Reads the dependency graph diff for the pull request; skipped for other events.
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, LicenseRef-scancode-google-patent-license-golang
  changes:
    # Decides whether the pull request touches anything outside inert-paths.
    # Fail-safe: a skipped or failed run leaves code unset, so command jobs run.
    # Runs on the caller's runner, like the command jobs, so repositories on
    # self-hosted runners don't depend on GitHub-hosted availability.
    if: inputs.inert-paths != '' && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge commit and its first parent (the base) are enough to diff.
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        name: Classify changed paths
        env:
          INERT_PATHS: ${{ inputs.inert-paths }}
        run: |
          code=true
          if [ -n "$(git diff --name-only HEAD^1 HEAD)" ]; then
            specs=()
            # read without IFS= trims surrounding whitespace; blank lines are dropped.
            while read -r spec; do
              if [ -n "$spec" ]; then specs+=(":(exclude,glob)$spec"); fi
            done <<< "$INERT_PATHS"
            # Separate assignment so a git error (bad pathspec) fails the job instead of skipping.
            rest="$(git diff --name-only HEAD^1 HEAD -- . "${specs[@]}")"
            [ -n "$rest" ] || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
  lint:
    needs: changes
    if: ${{ !cancelled() && inputs.lint-command != '' && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Gates the optional Nix token step; a client ID is not a credential.
      NIX_APP_CLIENT_ID: ${{ inputs.nix && secrets.app-client-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: inputs.go-version != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          # Module and build cache keyed on go.sum; off without go.sum or when Nix supplies the toolchain.
          cache: ${{ !inputs.nix && hashFiles('**/go.sum') != '' }}
          cache-dependency-path: '**/go.sum'
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.node-version != ''
        name: Enable corepack
        # Node 25+ no longer bundles corepack; install a pinned copy when absent.
        run: command -v corepack >/dev/null || npm install --global corepack@0.36.0; corepack enable
      - if: env.NIX_APP_CLIENT_ID != ''
        id: nix-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.NIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - if: inputs.nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
          github_access_token: ${{ steps.nix-token.outputs.token }}
      - name: Lint
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$COMMAND"
  build:
    needs: changes
    if: ${{ !cancelled() && inputs.build-command != '' && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Gates the optional Nix token step; a client ID is not a credential.
      NIX_APP_CLIENT_ID: ${{ inputs.nix && secrets.app-client-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: inputs.go-version != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          # Module and build cache keyed on go.sum; off without go.sum or when Nix supplies the toolchain.
          cache: ${{ !inputs.nix && hashFiles('**/go.sum') != '' }}
          cache-dependency-path: '**/go.sum'
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.node-version != ''
        name: Enable corepack
        # Node 25+ no longer bundles corepack; install a pinned copy when absent.
        run: command -v corepack >/dev/null || npm install --global corepack@0.36.0; corepack enable
      - if: env.NIX_APP_CLIENT_ID != ''
        id: nix-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.NIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - if: inputs.nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
          github_access_token: ${{ steps.nix-token.outputs.token }}
      - name: Build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
  test:
    needs: changes
    if: ${{ !cancelled() && inputs.test-command != '' && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Gates the optional Nix token step; a client ID is not a credential.
      NIX_APP_CLIENT_ID: ${{ inputs.nix && secrets.app-client-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: inputs.go-version != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          # Module and build cache keyed on go.sum; off without go.sum or when Nix supplies the toolchain.
          cache: ${{ !inputs.nix && hashFiles('**/go.sum') != '' }}
          cache-dependency-path: '**/go.sum'
      - if: inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.node-version != ''
        name: Enable corepack
        # Node 25+ no longer bundles corepack; install a pinned copy when absent.
        run: command -v corepack >/dev/null || npm install --global corepack@0.36.0; corepack enable
      - if: env.NIX_APP_CLIENT_ID != ''
        id: nix-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.NIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - if: inputs.nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
          github_access_token: ${{ steps.nix-token.outputs.token }}
      - name: Test
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
