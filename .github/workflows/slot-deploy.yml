name: Slot deploy
# Deploys one homelab slot after its validation passed on the default branch.
# Runs on the caller repository's own self-hosted runner, which connects
# outbound only and may run nothing but `homelab-deploy-slot`, as its own
# unprivileged user (the host decides how it reaches root). The host checks
# that the commit is the tip of main, builds it from GitHub itself, scans it,
# switches the slot's profile, checks health and rolls back on failure. No
# artifact, checkout, secret or third-party action is involved here.
on:
  workflow_call:
    inputs:
      slot:
        description: Homelab slot name (lower-case letters, digits and hyphens).
        type: string
        required: true
      runner:
        description: Runner label of the caller repository's deploy runner.
        type: string
        default: self-hosted
      timeout-minutes:
        description: Upper bound for the host-side build, switch and health check.
        type: number
        default: 60
permissions: {}
jobs:
  deploy:
    # Only the default branch deploys, from a push or a manual run on it.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runner }}
    # Recorded as a deployment to homelab-<slot>: the repository's
    # Deployments page shows what is live on the homelab, from which commit.
    environment: homelab-${{ inputs.slot }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions: {}
    # One deploy runs per repository and slot. GitHub keeps at most one more
    # pending, so a newer deploy replaces an older one still queued, and a
    # running switch is never cancelled.
    concurrency:
      group: slot-deploy-${{ github.repository }}-${{ inputs.slot }}
      cancel-in-progress: false
    steps:
      - name: Deploy slot
        env:
          SLOT: ${{ inputs.slot }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SLOT" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "invalid slot name: $SLOT" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit: $COMMIT" >&2; exit 1; }
          homelab-deploy-slot "$SLOT" "$COMMIT"
