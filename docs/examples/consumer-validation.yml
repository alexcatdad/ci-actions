# Example consumer workflow. Copy into an application repository as
# .github/workflows/validation.yml and replace REVIEWED_COMMIT_SHA with a
# reviewed full commit SHA of this repository. Commands are repository-owned.
# The weekly schedule reruns the main contract (security scans pick up new
# advisories) and CodeQL against the default branch.
name: Validation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-pr.yml@REVIEWED_COMMIT_SHA
    with:
      runner: macos-26
      lint-command: task lint
      build-command: task build
  main:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-main.yml@REVIEWED_COMMIT_SHA
    with:
      runner: macos-26
      test-command: task test
      integration-command: task test:integration
      security-command: task security
  codeql:
    # The one allowed write scope: uploading code scanning results.
    permissions:
      contents: read
      security-events: write
    uses: alexcatdad/ci-actions/.github/workflows/codeql.yml@REVIEWED_COMMIT_SHA
    with:
      languages: '["go", "swift"]'
      swift-build-command: task build
